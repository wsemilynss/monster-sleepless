/* ================= 查看密码与任务书解密（WebCrypto，与 review-lock.ps1 对应） ================= */
const PWK='mmReview.pw';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hexOf=buf=>[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');
const KEYS=new Map();
async function derive(pw,salt,iter){
  const norm=String(pw).trim().toUpperCase(),k=norm+'|'+salt+'|'+iter;if(KEYS.has(k))return KEYS.get(k);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(salt),iterations:iter},base,512));
  KEYS.set(k,bits);return bits;
}
async function checkPw(pw){if(!LOCK.check)return true;const bits=await derive(pw,LOCK.salt,LOCK.iter);return hexOf(await crypto.subtle.digest('SHA-256',bits))===LOCK.check;}
async function decryptEnc(text){
  const o=JSON.parse(text),bits=await derive(S.pw,o.salt,o.iter);
  const ek=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
  const mk=await crypto.subtle.importKey('raw',bits.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  const iv=b64(o.iv),ct=b64(o.ct),data=new Uint8Array(iv.length+ct.length);data.set(iv);data.set(ct,iv.length);
  if(!await crypto.subtle.verify('HMAC',mk,b64(o.mac),data))throw new Error('加密任务书校验失败（密码已更换？）');
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv},ek,ct));
}

async function probe(f){
  if(S.mode==='fs'){const h=await S.dir.getFileHandle(f.file);const file=await h.getFile();return {sig:file.lastModified+':'+file.size,mtime:file.lastModified,size:file.size,read:()=>file.text()};}
  let r=await fetch(f.file,{method:'HEAD',cache:'no-cache'});
  if(r.status===404)throw new Error('404 未找到');
  const lm=r.headers.get('last-modified'),et=r.headers.get('etag'),cl=r.headers.get('content-length');
  if(!r.ok||(!lm&&!et)){r=await fetch(f.file,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();return {sig:'h'+fnv(t),mtime:Date.parse(r.headers.get('last-modified')||'')||null,size:t.length,read:async()=>t};}
  return {sig:[et,lm,cl].join('|'),mtime:Date.parse(lm||'')||null,size:+cl||0,read:async()=>{const g=await fetch(f.file,{cache:'no-store'});if(!g.ok)throw new Error('HTTP '+g.status);return g.text();}};
}
async function refreshSource(key,force){
  const f=S.src[key];
  try{
    let p;
    try{p=await probe(f);}
    catch(e){ // 线上没有明文任务书时，改读加密版
      if(f.alt&&f.file!==f.alt&&/404|NotFound|could not be found/i.test(e.name+' '+e.message)){f.file=f.alt;f.sig=null;p=await probe(f);}else throw e;
    }
    f.checked=Date.now(); f.err=null;
    if(!force&&p.sig===f.sig)return false;
    let text=await p.read();
    if(/\.enc$/.test(f.file))text=await decryptEnc(text);
    const h=fnv(text);
    f.sig=p.sig; f.mtime=p.mtime; f.size=p.size||text.length;
    if(h===f.hash&&!force)return false;
    f.hash=h; f.text=text; return true;
  }catch(e){f.err=e.message||String(e);f.checked=Date.now();return false;}
}

function pathStr(p){return p.map((x,i)=>i===0?x:(typeof x==='number'?`[${x}]`:'.'+x)).join('');}
function harvestGame(data,src){
  const items=[],idx=lineIndex(src),decl={};
  for(const r in data){const m=new RegExp('(?:const|let|var)\\s+'+r+'\\s*=').exec(src);decl[r]=m?m.index:0;}
  const vis=(data.NIGHT&&data.NIGHT.visitors)||{},v2k=(data.NIGHT&&data.NIGHT.visitorOfKey)||{},mon=data.MONSTERS||{};
  const visN=k=>vis[k]&&vis[k].n?vis[k].n[0]:k;
  function entity(root,path){
    const p1=path[1];
    if(root==='MONSTERS'&&mon[p1])return {id:'m:'+p1,name:(mon[p1].name||[p1])[0]};
    if(root==='NOTEBOOK'){const c=(data.NOTEBOOK||[])[p1];if(c&&mon[c.from])return {id:'m:'+c.from,name:(mon[c.from].name||[c.from])[0]};}
    if(root==='VISITOR_CARDS'&&vis[p1])return {id:'v:'+p1,name:visN(p1)};
    if(root==='RITUAL_CARDS'){const c=(data.RITUAL_CARDS||[])[p1];if(c&&vis[c.for])return {id:'v:'+c.for,name:visN(c.for)};}
    if(['PATTERN_ACTS','FABLES','BEASTS'].includes(root)&&v2k[p1])return {id:'v:'+v2k[p1],name:visN(v2k[p1])+'（'+(PAT_ZH[p1]||p1)+'）'};
    if(/^(Q_OBSERVE|Q_LISTEN|Q_INQUIRE|DISPLAY_Q)$/.test(root))return {id:'x:body',name:'旧问诊题库（体征）'};
    for(const seg of path)if(typeof seg==='string'&&vis[seg])return {id:'v:'+seg,name:visN(seg)};
    return {id:'x:general',name:'通用 / 旁白 / 界面'};
  }
  function findLine(root,zh){
    const vars=[zh,zh.replace(/'/g,"\\'"),JSON.stringify(zh).slice(1,-1)];
    for(const v of vars){let o=src.indexOf(v,decl[root]||0);if(o<0)o=src.indexOf(v);if(o>=0)return lineAt(idx,o);}
    return null;
  }
  function enOf(parent,key,gp){
    if(Array.isArray(parent)){
      for(let j=key+1;j<parent.length;j++){const x=parent[j];if(typeof x==='string'&&!CJK.test(x)&&/[A-Za-z]/.test(x))return x;}
      if(gp&&gp.key==='zh'&&gp.obj&&Array.isArray(gp.obj.en))return gp.obj.en[key]||'';
      return '';
    }
    const k2=EN_KEY[key]||(key+'En');return typeof parent[k2]==='string'?parent[k2]:(typeof parent[key+'EN']==='string'?parent[key+'EN']:'');
  }
  function walk(v,path,parent,gp,root){
    if(typeof v==='string'){
      if(CJK.test(v)&&!/^\s*</.test(v)){
        const ps=pathStr(path);
        items.push({key:'game|'+ps,src:'game',root,path:ps,zh:v,en:parent?enOf(parent,path[path.length-1],gp):'',line:findLine(root,v),
          entity:entity(root,path),dialog:DIALOG_ROOTS.has(root)&&!/\.(four|myth|classic|omen|temper|lore)\b/.test(ps)});
      }
      return;
    }
    if(!v||typeof v!=='object'||v.__fn||v.__node||v.__cyc)return;
    const ctx={obj:parent,key:path[path.length-1]};
    if(Array.isArray(v))v.forEach((x,i)=>walk(x,[...path,i],v,ctx,root));
    else for(const k in v)walk(v[k],[...path,k],v,ctx,root);
  }
  for(const r in data)walk(data[r],[r],null,null,r);
  // HTML 静态文案：data-zh / data-en
  const re=/data-zh="([^"]*[\u3400-\u9fff][^"]*)"(?:\s+data-en="([^"]*)")?/g;let m;const seen={};
  while((m=re.exec(src))){const zh=m[1].replace(/&quot;/g,'"').replace(/&amp;/g,'&');const k='HTML·'+fnv(zh);seen[k]=(seen[k]||0)+1;const ps=k+(seen[k]>1?'#'+seen[k]:'');
    items.push({key:'game|'+ps,src:'game',root:'HTML',path:'HTML 静态文案',zh,en:(m[2]||'').replace(/&quot;/g,'"').replace(/&amp;/g,'&'),line:lineAt(idx,m.index),entity:{id:'x:general',name:'通用 / 旁白 / 界面'},dialog:false});}
  return items;
}

/* ================= 任务书（lane-brief.md）解析 ================= */
function parseBrief(md){
  const L=String(md||'').split(/\r?\n/),items=[],heads=[],tables=[];
  let fence=false;const inFence=[];
  L.forEach((l,i)=>{if(/^\s*```/.test(l))fence=!fence;inFence[i]=fence;const m=/^(#{2,4})\s+(.*)$/.exec(l);if(m&&!fence)heads.push({lv:m[1].length,text:m[2],line:i+1});});
  const secAt=line=>{let c={};for(const h of heads){if(h.line>line)break;if(h.lv===2)c={h2:h};else if(h.lv===3){c.h3=h;delete c.h4;}else if(h.lv===4)c.h4=h;}return c;};
  const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
  const clean=s=>String(s??'').replace(/`/g,'').replace(/\*\*/g,'').replace(/^[“"']|[”"']$/g,'').replace(/^★\s*/,'').trim();
  for(let i=0;i<L.length;i++){
    if(!inFence[i]&&/^\|/.test(L[i])&&i+1<L.length&&/^\|\s*:?-{2,}/.test(L[i+1])){
      const t={head:cells(L[i]),rows:[],line:i+1,sec:secAt(i+1)};let j=i+2;
      for(;j<L.length&&/^\|/.test(L[j]);j++)t.rows.push({c:cells(L[j]),line:j+1});
      tables.push(t);i=j-1;
    }
  }
  const tbl=pre=>tables.find(t=>t.sec.h3&&t.sec.h3.text.startsWith(pre))||tables.find(t=>t.sec.h2&&t.sec.h2.text.startsWith(pre));
  const col=(t,name)=>t.head.findIndex(h=>h.replace(/\*/g,'').startsWith(name));
  const roster=tbl('0.5');let names=[];
  if(roster){const ci=col(roster,'中文');if(ci>=0)names=roster.rows.map(r=>clean(r.c[ci])).filter(Boolean);}
  names.sort((a,b)=>b.length-a.length);
  const nameIn=s=>names.find(n=>String(s).includes(n))||'';
  const ent=n=>({id:'b:'+(n||'全局'),name:n||'全局 / 通用'});
  const push=o=>{const zh=clean(o.zh);if(!zh)return;items.push(Object.assign({src:'brief',root:'BRIEF',dialog:false,en:''},o,{zh,key:'brief|'+o.path}));};
  const title=clean(L.find(l=>/^#\s+/.test(l))||'lane-brief.md');
  const version=((/\bv\d+(?:\.\d+)?/i.exec(title)||[])[0]||'未标版本').toLowerCase();
  const evidence={};
  for(const t of tables.filter(t=>t.sec.h3&&/^5\.[23]/.test(t.sec.h3.text)))for(const r of t.rows){
    const id=clean(r.c[0]);if(/^[ET]\d{2}$/.test(id))evidence[id]={id,citation:clean(r.c[1]),note:clean(r.c[2]),line:r.line};
  }

  // v4 兼容：旧手札、四格、体征和完整四幕。
  const t23=tbl('2.3');
  if(t23){const cNo=col(t23,'卡'),cFrom=col(t23,'来自'),cTh=col(t23,'主题'),cS=col(t23,'故事化');
    if(cS>=0)t23.rows.forEach(r=>push({path:`§2.3 手札卡 ${r.c[cNo]}`,zh:r.c[cS],note:`主题：${clean(r.c[cTh])}`,line:r.line,entity:ent(nameIn(r.c[cFrom])),forceCats:['card']}));}
  const t41=tbl('4.1 ');
  if(t41){const cM=col(t41,'怪物'),cF=col(t41,'跨学科'),cT=col(t41,'第三幕');const lab=['志怪','生理','心理','饮食起居'];
    t41.rows.forEach(r=>{const n=nameIn(r.c[cM]);
      if(cF>=0)r.c[cF].split(/\s\/\s/).forEach((s,k)=>push({path:`§4.1 ${n} · 四格·${lab[k]||k+1}`,zh:s,line:r.line,entity:ent(n),forceCats:['card']}));
      if(cT>=0)push({path:`§4.1 ${n} · 第三幕工具`,zh:r.c[cT],line:r.line,entity:ent(n),forceCats:['action']});});}
  const t4b=tbl('4.1b');
  if(t4b){const cols=[['体质','body'],['望','body'],['闻','body'],['现代生理','card'],['第一幕体征','body']];
    t4b.rows.forEach(r=>{const n=nameIn(r.c[0]);cols.forEach(([h,c])=>{const ci=col(t4b,h);if(ci<0)return;
      push({path:`§4.1b ${n} · ${h}`,zh:r.c[ci],line:r.line,entity:ent(n),forceCats:c==='card'?['card','body']:['body']});});});}
  const h44=heads.find(h=>h.text.startsWith('4.4'));
  if(h44){let on=false,k=0;for(let i=h44.line;i<L.length;i++){const l=L[i];if(/^#{2,4}\s/.test(l))break;
    if(/RED_FLAGS/.test(l)){on=true;continue;}if(on&&/^\*\*/.test(l))break;
    if(on&&/^\s*-\s+/.test(l)){k++;push({path:`§4.4 红旗 #${k}`,zh:l.replace(/^\s*-\s+/,''),line:i+1,entity:ent(''),forceCats:['redflag']});}}}
  const cnt={};
  L.forEach((l,i)=>{if(inFence[i])return;const sec=secAt(i+1),h=(sec.h4||sec.h3||{}).text||'';
    if(!/^4\.(2|3|5)/.test(h))return;
    const n=nameIn(h)||(h.startsWith('4.2')?'旁妮儿拉灯':h.startsWith('4.5')?'K钥科斯基':'');
    if(/✔/.test(l)&&!/✔\s*=/.test(l)){cnt[n]=(cnt[n]||0)+1;push({path:`§${h.split(' ')[0]} ${n} · ✔#${cnt[n]}`,zh:l.replace(/^\s*[-\d.]+\s*/,'').replace(/✔/g,'').replace(/→\s*手札卡\s*\d+/,''),line:i+1,entity:ent(n),forceCats:['action']});}
    const mm=/镜子[^：:]*[：:]\s*(.+)$/.exec(l);
    if(mm)push({path:`§${h.split(' ')[0]} ${n} · 镜子`,zh:mm[1],line:i+1,entity:ent(n),forceCats:['action']});
  });

  // v5+：按语义而不是固定行号读取人物、观察、现实环境、证据与安全边界。
  const modern=heads.some(h=>h.lv===2&&h.text.startsWith('3. 14 只角色剧本总纲'));
  if(modern){
    L.forEach((l,i)=>{
      if(inFence[i]||/^\s*(?:$|\||#|>)/.test(l))return;
      const line=i+1,sec=secAt(line),h2=sec.h2?sec.h2.text:'',h3=sec.h3?sec.h3.text:'';
      const list=/^\s*(?:-\s+|\d+\.\s+)/.test(l);if(!list)return;
      const raw=l.replace(/^\s*(?:-\s+|\d+\.\s+)/,''),text=clean(raw);
      const label=((/^\*\*([^*]+)\*\*[：:]/.exec(raw)||[])[1]||'').trim();
      const n=nameIn(h3)||nameIn(l);
      if(h3.startsWith('0.3'))push({path:`§0.3 专业硬规则 · L${line}`,zh:text,line,entity:ent(''),forceCats:['evidence']});
      else if(h3.startsWith('1.1')||h3.startsWith('1.3'))push({path:`§${h3.split(' ')[0]} ${label||'叙事原则'} · L${line}`,zh:text,line,entity:ent(''),forceCats:h3.startsWith('1.3')?['action']:['context']});
      else if(/^3\.\d+/.test(h3)){
        const cat=/四诊|身体观察/.test(label)?'body':/第三幕|第四幕|行动/.test(label)?'action':/手札/.test(label)?'card':/解锁|安睡|收集|人生|心结|形象|交集/.test(label)?'context':'health';
        push({path:`§${h3.split(' ')[0]} ${n} · ${label||'剧情'}`,zh:text,line,entity:ent(n),forceCats:[cat]});
      }else if(h2.startsWith('4.')||h2.startsWith('5.')){
        const cat=h3.startsWith('4.4')?'redflag':h3.startsWith('4.2')||h3.startsWith('4.1')||h3.startsWith('4.3')?'body':h3.startsWith('5.1')?'evidence':h3.startsWith('5.4')?'card':'health';
        push({path:`§${(h3||h2).split(' ')[0]} ${label||'条目'} · L${line}`,zh:text,line,entity:ent(n),forceCats:[cat]});
      }
    });
    for(const t of tables){
      const h3=t.sec.h3?t.sec.h3.text:'';
      if(!/^4\.2|^5\.[23]/.test(h3))continue;
      const cat=/^5\./.test(h3)?'evidence':'body';
      t.rows.forEach(r=>{const n=nameIn(r.c.join(' '));push({path:`§${h3.split(' ')[0]} ${clean(r.c[0])}`,zh:r.c.join('；'),line:r.line,entity:ent(n),forceCats:[cat],note:/^5\./.test(h3)?'任务书来源台账；仍须核对原文与专业审校状态':''});});
    }
  }
  const used=new Set(items.map(x=>x.line));
  L.forEach((l,i)=>{if(inFence[i]||used.has(i+1))return;if(/睡眠窗口|躺得比睡得久/.test(l)&&!/^(#{1,4}\s|>)/.test(l)){const sec=secAt(i+1),h=(sec.h4||sec.h3||sec.h2||{}).text||'';
    push({path:`§睡眠窗口 · ${fnv(l)}`,zh:l.replace(/^\s*[-|]\s*/,'').slice(0,240),note:`所在章节：${h}`,line:i+1,entity:ent(nameIn(h)||nameIn(l)),forceCats:['window']});}});
  return {items,names,heads,tables,evidence,title,version,hash:fnv(md)};
}

/* ================= 分析：主题 · 类别 · 规则 · 审阅状态 ================= */
function analyzeItem(it){
  it.topics=TOPICS.filter(t=>t.re.test(it.zh)).map(t=>t.id);
  const c=new Set(it.forceCats||[]),r=it.root,p=it.path;
  if(r==='VISITOR_CARDS'||r==='NOTEBOOK'||/\.four\./.test(p))c.add('card');
  if(r==='RED_FLAGS'||it.topics.some(t=>['osa','mood','rls'].includes(t)))c.add('redflag');
  if(it.topics.includes('window'))c.add('window');
  if(/^(Q_OBSERVE|Q_LISTEN|Q_INQUIRE|DISPLAY_Q)$/.test(r)||/\.(body|sign)\b/.test(p)||it.topics.includes('bodysign'))c.add('body');
  if(r==='RITUAL_CARDS'||r==='PATTERN_ACTS'||/\.(fix|mirror)\b/.test(p))c.add('action');
  if(!c.size&&it.topics.length)c.add('health');
  it.cats=[...c];
  it.disc=[...new Set(it.topics.flatMap(t=>TOPIC[t].disc))];
  it.flags=[];
  for(const rule of RULES){
    if(rule.cats&&!rule.cats.some(x=>it.cats.includes(x)))continue;
    const hit=rule.test?rule.test(it):(rule.re.test(it.zh)&&!(rule.ex&&rule.ex.test(it.zh)));
    if(hit)it.flags.push(rule.id);
  }
  it.evidence=[...new Set((it.zh+' '+(it.note||'')).match(/\b[ET]\d{2}\b/g)||[])];
  it.needsEvidence=it.src==='brief'&&it.topics.length>0&&it.cats.some(c=>['card','redflag','window','body','action','health'].includes(c));
  it.h=fnv(it.zh+'\u0001'+(it.en||''));
  it.health=it.cats.length>0;
  return it;
}

/* ================= 任务书版本快照与专业差异 ================= */
function briefVersionFromText(text,meta={},parsed){
  const p=parsed||parseBrief(text),items=p.items.map(it=>analyzeItem(Object.assign({},it)));
  return Object.assign({},p,meta,{items,hash:fnv(text),text});
}
function rememberBrief(text,meta={},parsed){
  if(!text)return null;
  const v=briefVersionFromText(text,meta,parsed);S.versionCache.set(v.hash,v);
  const old=S.briefVersions.find(x=>x.hash===v.hash);
  const entry={id:'bv-'+v.hash,hash:v.hash,label:v.version,title:v.title,name:meta.name||CONF.brief,t:meta.t||meta.mtime||old?.t||Date.now(),seen:Date.now(),imported:!!meta.imported,text};
  let list=[entry,...S.briefVersions.filter(x=>x.hash!==v.hash)].slice(0,10),ok=false;
  while(list.length){
    store('briefVersions',list);const saved=store('briefVersions');
    if(Array.isArray(saved)&&saved.length===list.length){ok=true;break;}list.pop();
  }
  if(!ok){store('briefVersions',[]);list=[];}
  S.briefVersions=list;S.historyLimited=!ok&&!!text;
  return entry;
}
function currentBriefVersion(){
  const f=S.src.brief;if(f.text==null)return null;
  if(!S.versionCache.has(f.hash))S.versionCache.set(f.hash,briefVersionFromText(f.text,{name:f.file,mtime:f.mtime},S.brief||undefined));
  return S.versionCache.get(f.hash);
}
function getCmpVersion(ref){
  if(ref==='current')return currentBriefVersion();
  const v=S.briefVersions.find(x=>x.id===ref);if(!v)return null;
  if(!S.versionCache.has(v.hash))S.versionCache.set(v.hash,briefVersionFromText(v.text,{name:v.name,mtime:v.t}));
  return S.versionCache.get(v.hash);
}
function briefSummary(items){
  const need=items.filter(it=>it.needsEvidence),cited=need.filter(it=>it.evidence.length);
  const flags={error:0,warn:0,info:0};items.forEach(it=>it.flags.forEach(f=>flags[ruleOf(f).level]++));
  return {items:items.length,characters:new Set(items.map(it=>it.entity.id).filter(x=>x!=='b:全局')).size,
    topics:new Set(items.flatMap(it=>it.topics)).size,need:need.length,cited:cited.length,
    citedPct:need.length?Math.round(cited.length/need.length*100):0,flags,
    evidence:items.filter(it=>it.cats.includes('evidence')).length,redflags:items.filter(it=>it.cats.includes('redflag')).length};
}
function textSimilarity(a,b){
  const x=norm(a),y=norm(b);if(!x||!y)return 0;if(x===y)return 1;
  const grams=s=>{const m=new Map();for(let i=0;i<s.length-1;i++){const g=s.slice(i,i+2);m.set(g,(m.get(g)||0)+1);}return m;};
  const A=grams(x),B=grams(y);let hit=0,total=0;for(const [g,n] of A){total+=n;hit+=Math.min(n,B.get(g)||0);}for(const n of B.values())total+=n;
  return total?2*hit/total:0;
}
function diffBriefVersions(a,b){
  if(!a||!b)return null;
  const A=a.items,B=b.items,used=new Set(),matchedA=new Set(),changes=[];let unchanged=0,moved=0;
  const pair=(x,y)=>{matchedA.add(x);used.add(y);if(x.h===y.h){if(x.path===y.path)unchanged++;else moved++;return;}
    changes.push({kind:x.path===y.path?'changed':'rewritten',before:x,after:y,path:y.path||x.path});};
  for(const x of A){
    let y=B.find(z=>!used.has(z)&&z.path===x.path);
    if(!y)y=B.find(z=>!used.has(z)&&norm(z.zh)===norm(x.zh));
    if(y)pair(x,y);
  }
  for(const x of A){if(matchedA.has(x))continue;
    const left=B.filter(y=>!used.has(y));let best=null,score=0;
    for(const y of left){if(x.entity.id!==y.entity.id&&x.entity.id!=='b:全局'&&y.entity.id!=='b:全局')continue;const s=textSimilarity(x.zh,y.zh);if(s>score){score=s;best=y;}}
    if(best&&score>=.42){pair(x,best);changes[changes.length-1].kind='rewritten';changes[changes.length-1].inferred=true;changes[changes.length-1].similarity=score;}
  }
  for(const x of A)if(!matchedA.has(x))changes.push({kind:'removed',before:x,after:null,path:x.path});
  for(const y of B)if(!used.has(y))changes.push({kind:'added',before:null,after:y,path:y.path});
  const count=(items,key)=>{const o={};items.forEach(it=>it[key].forEach(x=>o[x]=(o[x]||0)+1));return o;};
  const byDisc={};for(const d in DISC)byDisc[d]={a:A.filter(it=>it.disc.includes(d)).length,b:B.filter(it=>it.disc.includes(d)).length};
  const byTopic={};for(const t of TOPICS)byTopic[t.id]={a:A.filter(it=>it.topics.includes(t.id)).length,b:B.filter(it=>it.topics.includes(t.id)).length};
  const newRisks=[],resolvedRisks=[];
  for(const c of changes){const af=c.before?c.before.flags:[],bf=c.after?c.after.flags:[];
    const added=bf.filter(f=>!af.includes(f)),removed=af.filter(f=>!bf.includes(f));
    if(added.length)newRisks.push({change:c,flags:added});if(removed.length)resolvedRisks.push({change:c,flags:removed});}
  const order={changed:0,rewritten:1,added:2,removed:3};changes.sort((x,y)=>order[x.kind]-order[y.kind]||x.path.localeCompare(y.path,'zh-CN'));
  return {a,b,changes,unchanged,moved,byDisc,byTopic,topicA:count(A,'topics'),topicB:count(B,'topics'),newRisks,resolvedRisks,sa:briefSummary(A),sb:briefSummary(B)};
}
function reviewOf(it){
  const r=S.reviews[it.key];
  if(!r)return {st:'todo'};
  if(r.h!==it.h)return Object.assign({},r,{st:'changed',prev:r.st});
  return r;
}
function setReview(key,patch){
  const it=S.byKey.get(key);if(!it)return;
  const cur=S.reviews[key]||{};
  S.reviews[key]=Object.assign({},cur,patch,{h:it.h,text:it.zh,by:$('#reviewer').value.trim()||cur.by||'',at:Date.now()});
  store('reviews',S.reviews);
}

/* ================= 主流程：读取 → 分析 → 对比 → 渲染 ================= */
async function checkAll(force){
  if(S.busy)return;S.busy=true;setSync('busy','检查中…');
  try{
    const gCh=await refreshSource('game',force),bCh=await refreshSource('brief',force);await refreshSource('mirror',force);
    if(gCh||(force&&S.src.game.text)){

    setSync(bad.length?'err':(intervalMs()?'live':'pause'),bad.length?bad.join('；'):(intervalMs()?'实时同步中':'已暂停'));

function rebuild(changed={}){
  const all=[...(S.game?S.game.items:[]),...(S.brief?S.brief.items:[])].map(analyzeItem);
  const seen={};for(const it of all){if(seen[it.key]){seen[it.key]++;it.key+='#'+seen[it.key];}else seen[it.key]=1;}
  const prev=S.snap||{},now={};all.forEach(it=>now[it.key]=it.h);
  const hadPrev=Object.keys(prev).length>0;
  const diff={t:Date.now(),added:[],removed:[],changed:[]};
  if(hadPrev){
    const prevText=store('snapText')||{};
    for(const it of all){if(!(it.key in prev))diff.added.push({key:it.key,zh:it.zh});else if(prev[it.key]!==it.h)diff.changed.push({key:it.key,from:prevText[it.key]||'',to:it.zh});}
    for(const k in prev)if(!(k in now))diff.removed.push({key:k,zh:(prevText[k]||'')});
  }
  S.items=all;S.byKey=new Map(all.map(it=>[it.key,it]));
  if(diff.added.length||diff.removed.length||diff.changed.length){
    S.fresh=new Set([...diff.added,...diff.changed].map(x=>x.key));
    const bs=briefSummary(all.filter(it=>it.src==='brief'));
    const ent={t:diff.t,label:S.ready?'实时检测到':'自上次打开本页以来',sources:{game:!!changed.game,brief:!!changed.brief},brief:changed.brief?bs:null,added:diff.added.slice(0,40),removed:diff.removed.slice(0,40),changed:diff.changed.slice(0,40),n:[diff.added.length,diff.changed.length,diff.removed.length]};
    S.log.unshift(ent);S.log=S.log.slice(0,40);store('log',S.log);
    toast(changed.brief?`任务书专业分析已同步：${bs.items} 条 · ${bs.topics} 个主题 · 来源标注 ${bs.citedPct}%`:`检测到游戏剧本更新：新增 ${diff.added.length} · 修改 ${diff.changed.length} · 删除 ${diff.removed.length}`);
  }
  S.snap=now;store('snap',now);
  const txt={};all.forEach(it=>txt[it.key]=it.zh);store('snapText',txt);
  S.checks=globalChecks();
  S.corpus=norm(S.game?S.game.items.map(x=>x.zh).join('|'):'');
  S.ready=true;
  render();
}
function globalChecks(){
  const g=S.game,src=g?g.src:'',d=g?g.data:{},gtext=g?g.items.map(x=>x.zh).join('\n'):'';
  const out=[],add=(ok,n,detail,pend)=>out.push({ok,n,detail,pend});
  if(!g)add(false,'读取游戏剧本数据',S.err||S.src.game.err||'尚未读取到 怪物夜未眠.html');
  else{
    add(/这是故事，?不是诊断/.test(src),'免责声明"这是故事，不是诊断"','第 0 节要求在开场、日记等处保留。');
    add(/医生|就医/.test(gtext+src),'就医提示（"不舒服请找医生"/就医信笺）','红旗触发时需给出就医指引。');
    add(!!d.RED_FLAGS,'RED_FLAGS 红旗清单已在游戏中实现',d.RED_FLAGS?`${(d.RED_FLAGS.length||Object.keys(d.RED_FLAGS).length)} 条`:'任务书 4.4 / R9 待实现',!d.RED_FLAGS);
    add(/心理援助|援助热线|危机/.test(src),'情绪类红旗提供当地危机/心理援助提示','R9 待实现时为未通过。',!/心理援助|援助热线|危机/.test(src));
    add(!!d.NOTEBOOK,'NOTEBOOK 夜游手札已实现',d.NOTEBOOK?`${d.NOTEBOOK.length} 张`:'任务书 / R2 待实现',!d.NOTEBOOK);
    add(!!d.MONSTERS,'MONSTERS 角色数据已实现',d.MONSTERS?`${Object.keys(d.MONSTERS).length} 个角色`:'任务书 / R2 待实现',!d.MONSTERS);
    add(!g.runtime.length,'游戏脚本在沙箱中运行无报错',g.runtime.length?g.runtime.slice(0,5).join('；'):'—');
    if(S.src.mirror.text!=null)add(S.src.mirror.hash===S.src.game.hash,'index.html 与 怪物夜未眠.html 内容一致','README 约定两份文件必须相同。');
    const errN=S.items.filter(it=>it.src==='game'&&it.flags.some(f=>ruleOf(f).level==='error')).length;
    add(errN===0,'游戏文案无"底线"级规则问题',errN?`${errN} 条，见"规则检查"`:'—');
  }
  if(S.brief){

    add(S.brief.names.length===14,'任务书角色名册（14 个）已解析',`识别到 ${S.brief.names.length} 个中文显示名；英文与完整文件名见名册。`);
    add(bi.length>0,'任务书专业分析已同步',`${S.brief.version} · ${bi.length} 条 · ${bs.topics} 个专业主题 · ${bs.redflags} 条红旗/转介。`);
    add(bs.need===0||bs.cited>0,'任务书含显式 E/T 来源标注',`${bs.cited}/${bs.need} 条专业主题条目带来源编号（${bs.citedPct}%）；这是标注覆盖，不代表原文已核验。`,bs.cited<bs.need);
    const be=S.items.filter(it=>it.src==='brief'&&it.flags.some(f=>ruleOf(f).level==='error')).length;
    add(be===0,'任务书文案无"底线"级规则问题',be?`${be} 条，请在规则检查中判断是否为禁止性规则原文。`:'—');
  }else add(false,'读取任务书专业分析',S.src.brief.err||'尚未读取到 lane-brief.md / lane-brief.enc');
  return out;
}

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('mmReview',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}

function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a.toFixed(2)})`;}

function vChain(){
  const src=autoSrc(S.ui.chSrc),list=healthItems().filter(it=>it.src===src);
  const tops=TOPICS.filter(t=>list.some(it=>it.topics.includes(t.id)));
  const refs=REFS.filter(r=>tops.some(t=>t.refs.includes(r.id)));
  const ents=[...new Map(list.filter(it=>it.topics.length).map(it=>[it.entity.id,it.entity.name])).entries()];
  const R=22,G=6,H=Math.max(refs.length,tops.length,ents.length)*(R+G)+40;
  const X={r:10,t:400,e:760},W={r:300,t:250,e:230};
  const yR={},yT={},yE={};const place=(arr,o,key)=>{const off=(H-arr.length*(R+G))/2;arr.forEach((x,i)=>o[key(x)]=off+i*(R+G));};
  place(refs,yR,r=>r.id);place(tops,yT,t=>t.id);place(ents,yE,e=>e[0]);
  let links='';
  for(const t of tops){for(const rid of t.refs)if(yR[rid]!=null)links+=`<path class="lk" data-t="${t.id}" data-r="${rid}" stroke="${DISC[t.disc[0]].c}" stroke-width="1.6" d="M${X.r+W.r},${yR[rid]+R/2} C${X.t-40},${yR[rid]+R/2} ${X.r+W.r+40},${yT[t.id]+R/2} ${X.t},${yT[t.id]+R/2}"/>`;
    for(const [e] of ents){const n=list.filter(it=>it.entity.id===e&&it.topics.includes(t.id)).length;if(!n)continue;
      links+=`<path class="lk" data-t="${t.id}" data-e="${esc(e)}" stroke="${DISC[t.disc[0]].c}" stroke-width="${(1+Math.log2(n+1)*1.6).toFixed(1)}" d="M${X.t+W.t},${yT[t.id]+R/2} C${X.e-50},${yT[t.id]+R/2} ${X.t+W.t+50},${yE[e]+R/2} ${X.e},${yE[e]+R/2}"><title>${esc(t.n)} → ${n} 条</title></path>`;}}
  const node=(x,y,w,label,fill,attr)=>`<g class="nd" ${attr}><rect x="${x}" y="${y}" width="${w}" height="${R}" fill="${fill}" stroke="#ddd"/><text x="${x+8}" y="${y+15}">${esc(label.length>34?label.slice(0,33)+'…':label)}</text></g>`;
  let nodes=refs.map(r=>node(X.r,yR[r.id],W.r,`[${REF_NO[r.id]}] ${shortRef(r.id)} · ${r.type}`,'#fff',`data-r="${r.id}"`)).join('');
  nodes+=tops.map(t=>node(X.t,yT[t.id],W.t,t.n,hexA(DISC[t.disc[0]].c,.14),`data-t="${t.id}"`)).join('');
  nodes+=ents.map(([e,n])=>node(X.e,yE[e],W.e,n,'#f3f6fa',`data-e="${esc(e)}"`)).join('');
  const sel=S.ui.topic&&TOPIC[S.ui.topic];
  let h=`<h2>证据链：出处 → 专业原理 → 剧情</h2><p class="sub">左列是文献或典籍，中列是专业原理，右列是剧情里的角色或单元；线越粗，关联条目越多。悬停任一节点可高亮它的关联，点原理节点可在下方查看对应条目。</p>${srcToggle('chsrc',src)}
  <div class="chain" style="margin-top:10px"><svg width="${X.e+W.e+10}" height="${H}" viewBox="0 0 ${X.e+W.e+10} ${H}"><text x="${X.r}" y="16" font-weight="600">出处</text><text x="${X.t}" y="16" font-weight="600">专业原理</text><text x="${X.e}" y="16" font-weight="600">剧情角色 / 单元</text>${links}${nodes}</svg></div>`;
  if(sel){const its=list.filter(it=>it.topics.includes(sel.id));h+=`<h3>${esc(sel.n)} · ${its.length} 条</h3>${topicBlock(sel.id).replace('<details','<details open')}${its.slice(0,60).map(itemCard).join('')}`;}
  return h;
}

function versionCard(v,sum,label,current){if(!v)return `<div class="box version-card"><b>${label}</b><div class="empty">请选择一个版本或导入 Markdown。</div></div>`;

  <div class="diff-deltas">${topicAdd.map(t=>`<span class="chip impl-yes">新增主题：${esc(TOPIC[t].n)}</span>`).join('')}${topicDel.map(t=>`<span class="chip impl-no">移除主题：${esc(TOPIC[t].n)}</span>`).join('')}${flagAdd.map(f=>`<span class="chip lv-error">新增提示：${esc(ruleOf(f).n)}</span>`).join('')}${flagDel.map(f=>`<span class="chip impl-yes">解除提示：${esc(ruleOf(f).n)}</span>`).join('')}${evidenceChips([...new Set([...evA,...evB])])}</div>

  h+=`<div class="grid g2"><div class="box"><h3>新增规则提示</h3>${d.newRisks.slice(0,12).map(x=>`<div class="check"><span class="ic no">!</span><div>${x.flags.map(flagChip).join(' ')}<div class="sub">${esc(x.change.path)}</div></div></div>`).join('')||'<span class="sub">没有新增规则提示。</span>'}</div><div class="box"><h3>解除规则提示</h3>${d.resolvedRisks.slice(0,12).map(x=>`<div class="check"><span class="ic ok">✓</span><div>${x.flags.map(flagChip).join(' ')}<div class="sub">${esc(x.change.path)}</div></div></div>`).join('')||'<span class="sub">没有解除的规则提示。</span>'}</div></div>`;
  const q=S.ui.cmpText.trim().toLowerCase(),list=d.changes.filter(c=>(S.ui.cmpKind==='all'||c.kind===S.ui.cmpKind)&&(!q||(c.path+' '+(c.before?c.before.zh:'')+' '+(c.after?c.after.zh:'')).toLowerCase().includes(q)));
  h+=`<h2>逐条专业向区别</h2><div class="filters"><select data-cmpkind><option value="all">全部变化</option>${Object.keys(DIFF_KIND).map(k=>`<option value="${k}"${S.ui.cmpKind===k?' selected':''}>${DIFF_KIND[k]}</option>`).join('')}</select><input type="search" data-cmptext placeholder="搜索前后文案、角色、章节…" value="${esc(S.ui.cmpText)}"><span class="sub">${list.length} 条变化 · 内容相同 ${d.unchanged} · 仅移动 ${d.moved}</span></div>
  <div class="diff-list">${list.slice(0,120).map(diffChangeCard).join('')||'<div class="empty">两个版本没有符合筛选条件的变化。</div>'}</div>${list.length>120?'<p class="sub">仅显示前 120 条；请用筛选缩小范围，或导出完整对比。</p>':''}`;
  return h;
}

/* ================= 视图：出处与原理 ================= */
function vRefs(){
  const hi=healthItems();
  let h=`<h2>专业原理（${TOPICS.length} 项）</h2><p class="sub">每项原理写明专业逻辑、在剧情里的落点、审阅注意事项和出处编号；数字是当前命中的条目数。</p>`;
  for(const t of TOPICS){const l=hi.filter(it=>it.topics.includes(t.id)),g=l.filter(x=>x.src==='game').length;
    const ents=[...new Set(l.map(it=>it.entity.name))];
    h+=`<details class="tp"><summary>${esc(t.n)} ${t.disc.map(discChip).join(' ')} <span class="sub">游戏 ${g} · 任务书 ${l.length-g}</span></summary>
    <p><b>专业逻辑：</b>${esc(t.logic)}</p><p><b>剧情关联：</b>${esc(t.story)}</p><p class="care" style="color:#8a5c00"><b>审阅注意：</b>${esc(t.caution)}</p>
    <p><b>出处：</b>${t.refs.map(refLink).join('；')}</p><p class="sub">涉及：${esc(ents.join('、')||'—')}</p>
    <p><button type="button" data-topic="${t.id}">在证据链中查看</button> <button type="button" data-qtext="" data-qtopic="${t.id}">在队列中筛选</button></p></details>`;}
  h+=`<h2>参考文献（${REFS.length} 条）</h2><ol class="refs">`;
  for(const r of REFS){const used=TOPICS.filter(t=>t.refs.includes(r.id)).map(t=>t.n);
    const vc=/已核对/.test(r.v)?'v-ok':(/典籍|专著/.test(r.v)?'v-book':'v-todo');
    h+=`<li id="ref-${r.id}">${esc(r.a)} ${esc(r.t)} <i>${esc(r.j)}</i>${r.doi?` doi:<a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">${esc(r.doi)}</a>`:''}${r.pmid?` · PMID <a href="https://pubmed.ncbi.nlm.nih.gov/${esc(r.pmid)}/" target="_blank" rel="noopener">${esc(r.pmid)}</a>`:''}
    <span class="vbadge ${vc}">${esc(r.v)}</span> <span class="chip">${esc(r.type)}</span><div class="sub">用于：${esc(used.join('、')||'—')}</div></li>`;}
  return h+`</ol><p class="sub">核对说明：带 DOI 或 PMID 的条目已在 Crossref / PubMed 逐条核对（2026-11-08）；典籍只作志怪叙事，不作为循证证据；"待补"请中医背景审阅者补充。</p>`;
}

/* ================= 视图：更新记录 ================= */
function logEntryHTML(e){
  const li=(arr,f)=>arr.map(f).join('');
  return `<div class="row"><b>${fmtT(e.t)}</b><span class="chip">${esc(e.label||'')}</span>${e.sources&&e.sources.brief?'<span class="chip src-brief">任务书专业分析已同步</span>':''}${e.sources&&e.sources.game?'<span class="chip src-game">游戏分析已同步</span>':''}<span class="sub">新增 ${e.n[0]} · 修改 ${e.n[1]} · 删除 ${e.n[2]}</span></div>
  ${e.brief?`<div class="history-note" style="margin:8px 0">当前任务书：${e.brief.items} 条 · ${e.brief.topics} 个专业主题 · 显式来源 ${e.brief.cited}/${e.brief.need}（${e.brief.citedPct}%） <button type="button" data-go="compare">打开双版本专业对比</button></div>`:''}<ul class="log">
  ${li(e.changed,x=>`<li><span class="chip fresh">改</span> <span class="old" style="display:inline"><s>${esc(x.from)}</s></span> → ${esc(x.to)} <span class="mono sub">${esc(x.key.replace(/^(game|brief)\|/,''))}</span></li>`)}
  ${li(e.added,x=>`<li><span class="chip impl-yes">增</span> ${esc(x.zh)} <span class="mono sub">${esc(x.key.replace(/^(game|brief)\|/,''))}</span></li>`)}
  ${li(e.removed,x=>`<li><span class="chip lv-error">删</span> ${esc(x.zh)}</li>`)}</ul>`;
}
function vLog(){return `<h2>更新记录</h2><p class="sub">每次检测到 ${CONF.game} 或 ${CONF.brief} 的文案变化都会记一笔（保存在本浏览器，最多 40 次）。任务书还会保存完整版本快照，供双版本专业对比；被修改条目的原审阅结论会自动转为“已改动 · 待复审”。</p>`
  +(S.log.length?S.log.map(e=>`<div class="box" style="margin:10px 0">${logEntryHTML(e)}</div>`).join(''):'<div class="empty">还没有记录。</div>')
  +`<p><button type="button" data-clearlog="1">清空更新记录</button></p>`;}

/* ================= 导出 / 导入 ================= */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
function exportMd(){
  const hi=healthItems(),who=$('#reviewer').value.trim();
  let md=`# 《怪物夜未眠》专业学科与剧情审阅报告\n\n- 生成时间：${fmtT(Date.now())}\n- 审阅人：${who||'（未填写）'}\n- 游戏文件：${CONF.game}（指纹 ${S.src.game.hash||'—'}，修改于 ${fmtT(S.src.game.mtime)}）\n- 任务书：${CONF.brief}（指纹 ${S.src.brief.hash||'—'}，修改于 ${fmtT(S.src.brief.mtime)}）\n- 说明：自动归类和规则检查只作提示；中医内容只作"传统说法"叙事。\n\n## 全局安全检查\n\n`;
  md+=S.checks.map(c=>`- [${c.ok?'x':' '}] ${c.n}${c.detail?`：${c.detail}`:''}`).join('\n')+'\n';
  for(const k of Object.keys(CATS)){const l=hi.filter(it=>it.cats.includes(k));if(!l.length)continue;const cc=statCount(l);
    md+=`\n## ${CATS[k].n}（${l.length} 条：通过 ${cc.ok} · 需修改 ${cc.fix} · 待讨论 ${cc.discuss} · 待复审 ${cc.changed} · 未审 ${cc.todo}）\n`;
    for(const it of l){const rv=reviewOf(it);
      md+=`\n### [${ST[rv.st]}] ${it.zh}\n\n- 位置：\`${locOf(it)}\`\n- 角色：${it.entity.name}${it.en?`\n- 英文：${it.en}`:''}\n`;
      if(it.topics.length)md+=`- 专业原理：${it.topics.map(t=>TOPIC[t].n+' '+TOPIC[t].refs.map(r=>'['+REF_NO[r]+']').join('')).join('；')}\n`;
      if(it.evidence&&it.evidence.length)md+=`- 任务书来源编号：${it.evidence.join('、')}（仍须核验原文与审校状态）\n`;
      if(it.flags.length)md+=`- 规则提示：${it.flags.map(f=>LV[ruleOf(f).level].n+'·'+ruleOf(f).n).join('；')}\n`;
      if(rv.note)md+=`- 审阅意见：${rv.note}${rv.by?`（${rv.by}，${fmtT(rv.at)}）`:''}\n`;
      if(rv.st==='changed')md+=`- 审阅时原文：${rv.text}\n`;}}
  md+=`\n## 参考文献\n\n`+REFS.map((r,i)=>`${i+1}. ${r.a} ${r.t} ${r.j}${r.doi?' doi:'+r.doi:''}${r.pmid?' PMID:'+r.pmid:''}（${r.v}）`).join('\n')+'\n';
  download(`审阅报告-${stamp()}.md`,md,'text/markdown;charset=utf-8');
}
function exportJson(){download(`审阅记录-${stamp()}.json`,JSON.stringify({app:'monster-sleepless-review',v:1,exportedAt:new Date().toISOString(),reviewer:$('#reviewer').value.trim(),game:{hash:S.src.game.hash,mtime:S.src.game.mtime},brief:{hash:S.src.brief.hash},reviews:S.reviews},null,1),'application/json');}
function exportBriefDiff(){
  const a=getCmpVersion(S.ui.cmpA),b=getCmpVersion(S.ui.cmpB)||currentBriefVersion();if(!a||!b){alert('请先选择或导入两个任务书版本。');return;}
  const d=diffBriefVersions(a,b);let md=`# lane-brief.md 双版本专业对比\n\n- 生成时间：${fmtT(Date.now())}\n- 基准版 A：${a.title}（${a.hash}）\n- 对比版 B：${b.title}（${b.hash}）\n- 说明：自动主题、风险和来源覆盖仅作审阅导航；跨章节改写为相似度推断配对，须人工确认。\n\n## 总览\n\n- 专业/叙事条目：${d.sa.items} → ${d.sb.items}\n- 专业主题：${d.sa.topics} → ${d.sb.topics}\n- 显式 E/T 来源标注：${d.sa.cited}/${d.sa.need}（${d.sa.citedPct}%）→ ${d.sb.cited}/${d.sb.need}（${d.sb.citedPct}%）\n- 新增规则提示：${d.newRisks.length}；解除规则提示：${d.resolvedRisks.length}\n\n## 学科覆盖\n\n${Object.keys(DISC).map(k=>`- ${DISC[k].n}：${d.byDisc[k].a} → ${d.byDisc[k].b}`).join('\n')}\n\n## 逐条变化\n\n`;
  for(const c of d.changes){md+=`### ${DIFF_KIND[c.kind]} · ${c.path}\n\n- 角色：${esc((c.after||c.before).entity.name)}${c.inferred?`\n- 推断配对相似度：${Math.round(c.similarity*100)}%`:''}\n`;
    if(c.before)md+=`\n**A（L${c.before.line}）**\n\n${c.before.zh}\n`;if(c.after)md+=`\n**B（L${c.after.line}）**\n\n${c.after.zh}\n`;
    const ids=[...new Set([...(c.before?c.before.evidence:[]),...(c.after?c.after.evidence:[])])];if(ids.length)md+=`\n来源编号：${ids.join('、')}\n`;md+='\n';}
  download(`任务书专业对比-${stamp()}.md`,md,'text/markdown;charset=utf-8');
}
async function importJson(file){
  try{const o=JSON.parse(await file.text());if(!o||!o.reviews)throw new Error('不是审阅记录文件');let n=0;
    for(const k in o.reviews){const a=S.reviews[k],b=o.reviews[k];if(!a||(b.at||0)>(a.at||0)){S.reviews[k]=b;n++;}}
    store('reviews',S.reviews);toast(`已合并 ${n} 条审阅记录（来自 ${o.reviewer||'未署名'}）`);render();}
  catch(e){alert('导入失败：'+e.message);}
}

/* ================= 事件 ================= */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.ui.tab=b.dataset.tab;S.ui.limit=80;render();scrollTo(0,0);});
$('#view').addEventListener('click',e=>{
  const t=e.target,d=t.closest('button,td')?.dataset||{};
  if(d.act==='st'){const k=t.closest('.item').dataset.key;setReview(k,{st:d.st});rerenderItem(k);return;}
  if(d.go){S.ui.tab=d.go;if(d.q)S.ui.q=d.q;S.ui.limit=80;render();scrollTo(0,0);return;}
  if(d.q&&t.closest('.qtabs')&&S.ui.tab==='queue'){S.ui.q=d.q;S.ui.limit=80;render();return;}
  if(d.more){S.ui.limit+=80;render();return;}
  if(d.mxsrc){S.ui.mxSrc=d.mxsrc;render();return;}
  if(d.chsrc){S.ui.chSrc=d.chsrc;S.ui.topic=null;render();return;}
  if(d.mx){const [ent,disc,src]=d.mx.split('|');Object.assign(S.ui,{tab:'queue',q:'all',ent,disc,srcF:src,st:'all',text:'',issues:false,limit:80});render();scrollTo(0,0);return;}
  if(d.find){const it=S.byKey.get(d.find);if(!it)return;Object.assign(S.ui,{tab:'queue',q:'all',srcF:it.src,ent:'all',disc:'all',st:'all',issues:false,text:it.zh.slice(0,24),limit:80});render();scrollTo(0,0);return;}
  if(d.topic){S.ui.tab='chain';S.ui.topic=d.topic;const it=healthItems().find(x=>x.topics.includes(d.topic));if(it)S.ui.chSrc=it.src;render();scrollTo(0,0);return;}
  if(d.qtopic){const tp=TOPIC[d.qtopic];Object.assign(S.ui,{tab:'queue',q:'all',srcF:'all',ent:'all',disc:tp.disc[0],st:'all',issues:false,text:'',limit:80});render();scrollTo(0,0);return;}
  if(d.latestcmp){const cur=currentBriefVersion(),prev=S.briefVersions.find(v=>!cur||v.hash!==cur.hash);if(!prev){toast('还没有上一版快照，请先导入旧版 A。');return;}S.ui.cmpA=prev.id;S.ui.cmpB='current';render();return;}
  if(d.exportdiff){exportBriefDiff();return;}
  if(d.clearlog){if(confirm('清空本浏览器里的更新记录？审阅结论不受影响。')){S.log=[];store('log',[]);render();}}
});
$('#view').addEventListener('input',e=>{
  const t=e.target;
  if(t.hasAttribute('data-cmptext')){clearTimeout(S._ct);const pos=t.selectionStart;S.ui.cmpText=t.value;S._ct=setTimeout(()=>{render();const n=$('#view [data-cmptext]');if(n){n.focus();n.setSelectionRange(pos,pos);}},250);return;}
  if(t.dataset.act==='note'){const k=t.closest('.item').dataset.key;clearTimeout(t._t);t._t=setTimeout(()=>{setReview(k,{note:t.value});},400);return;}
  const f=t.dataset.f;if(!f)return;
  S.ui[f]=t.type==='checkbox'?t.checked:t.value;S.ui.limit=80;
  if(f==='text'){clearTimeout(S._st);S._st=setTimeout(()=>{const pos=t.selectionStart;render();const n=$('#view [data-f="text"]');if(n){n.focus();n.setSelectionRange(pos,pos);}},250);}
  else render();
});
$('#view').addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.ver){S.ui[t.dataset.ver]=t.value;render();return;}
  if(t.hasAttribute('data-cmpkind')){S.ui.cmpKind=t.value;render();return;}
  const side=t.dataset.briefimport,file=t.files&&t.files[0];if(!side||!file)return;
  try{const text=await file.text(),entry=rememberBrief(text,{name:file.name,imported:true});S.ui[side]=entry.id;S.ui.tab='compare';render();toast(`已导入 ${file.name}，专业分析已更新。`);}catch(err){alert('读取版本失败：'+err.message);}
});
$('#view').addEventListener('focusout',e=>{if(e.target.tagName==='TEXTAREA'&&S.pending)setTimeout(()=>{if(document.activeElement?.tagName!=='TEXTAREA')render();},50);});
function rerenderItem(k){const it=S.byKey.get(k),el=$(`#view .item[data-key="${CSS.escape(k)}"]`);if(it&&el){el.outerHTML=itemCard(it);}renderTabs();}
$('#btnRefresh').onclick=()=>{if(S.mode==='none'){connectDir();return;}Object.values(S.src).forEach(f=>f.sig=null);checkAll(true);};
$('#btnConnect').onclick=connectDir;
$('#btnMd').onclick=exportMd;$('#btnJson').onclick=exportJson;
$('#fileImport').onchange=e=>{const f=e.target.files[0];if(f)importJson(f);e.target.value='';};
$('#selInterval').onchange=()=>{store('interval',$('#selInterval').value);schedule();setSync(intervalMs()?'live':'pause',intervalMs()?'实时同步中':'已暂停');};
$('#reviewer').oninput=e=>store('reviewer',e.target.value);
$('#btnLock').onclick=()=>{try{sessionStorage.removeItem(PWK);localStorage.removeItem(PWK);}catch(e){}location.reload();};
document.addEventListener('visibilitychange',()=>{if(S.unlocked&&!document.hidden&&S.mode!=='none')checkAll(false);});

/* ================= 启动：先解锁，再开始读取与同步 ================= */
async function start(){
  S.unlocked=true;document.body.classList.remove('locked');$('#lock').remove();
  $('#reviewer').value=store('reviewer')||'';
  const iv=store('interval');if(iv)$('#selInterval').value=iv;
  renderTabs();renderSrcInfo();
  if(S.mode==='http'){checkAll(true);return;}
  setSync('pause','未连接源文件');
  if(!(await restoreDir()))render();
}
(async function init(){
  const form=$('#lockForm'),err=$('#lockErr'),btn=$('#lockBtn');
  if(!window.crypto||!crypto.subtle){err.textContent='这个浏览器（或非 https 地址）不支持页面加密功能，请用 https 线上地址或新版 Chrome / Edge 打开。';btn.disabled=true;return;}
  let saved='';try{saved=sessionStorage.getItem(PWK)||localStorage.getItem(PWK)||'';}catch(e){}
  if(saved&&await checkPw(saved).catch(()=>false)){S.pw=saved;return start();}
  $('#lockPw').focus();
  form.addEventListener('submit',async e=>{
    e.preventDefault();const pw=$('#lockPw').value;if(!pw.trim())return;
    btn.disabled=true;btn.textContent='验证中…';err.textContent='';
    const ok=await checkPw(pw).catch(()=>false);
    if(!ok){KEYS.clear();btn.disabled=false;btn.textContent='进入';err.textContent='密码不正确，请再试一次。';$('#lockPw').select();return;}
    const norm=pw.trim().toUpperCase();S.pw=norm;
    try{sessionStorage.setItem(PWK,norm);if($('#lockRemember').checked)localStorage.setItem(PWK,norm);}catch(e){}
    start();
  });
})();
</script>
